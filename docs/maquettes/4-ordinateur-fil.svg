<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" font-family="Arial, sans-serif">
  <rect width="1280" height="760" fill="#f4f4f4" stroke="#999" stroke-width="2"/>

  <!-- En-tête -->
  <rect x="0" y="0" width="1280" height="64" fill="#333"/>
  <text x="40" y="41" font-size="24" font-weight="bold" fill="#fff">Réseau</text>
  <text x="1080" y="40" text-anchor="end" font-size="14" fill="#fff">sicilia · Mon profil</text>
  <rect x="1110" y="18" width="130" height="30" fill="none" stroke="#fff"/>
  <text x="1175" y="38" text-anchor="middle" font-size="13" fill="#fff">Déconnexion</text>

  <!-- Colonne centrale : 600 px maximum -->
  <rect x="340" y="88" width="300" height="44" fill="#fff"/>
  <rect x="340" y="128" width="300" height="4" fill="#333"/>
  <text x="490" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Mon fil</text>
  <rect x="640" y="88" width="300" height="44" fill="#e8e8e8"/>
  <text x="790" y="116" text-anchor="middle" font-size="15" fill="#666">Découvrir</text>

  <rect x="340" y="148" width="600" height="120" fill="#fff" stroke="#ccc"/>
  <rect x="356" y="162" width="568" height="58" fill="#fff" stroke="#999"/>
  <text x="368" y="186" font-size="14" fill="#aaa">Quoi de neuf ?</text>
  <text x="356" y="254" font-size="12" fill="#888">0 / 500</text>
  <rect x="834" y="232" width="90" height="28" fill="#333"/>
  <text x="879" y="251" text-anchor="middle" font-size="13" fill="#fff">Publier</text>

  <rect x="340" y="284" width="600" height="170" fill="#fff" stroke="#ccc"/>
  <text x="356" y="312" font-size="15" font-weight="bold" fill="#225" text-decoration="underline">bob_essai</text>
  <text x="924" y="312" text-anchor="end" font-size="12" fill="#999">17/11/2026 14:05</text>
  <text x="356" y="342" font-size="15" fill="#222">Bonjour, je suis Bob !</text>
  <rect x="356" y="362" width="100" height="30" fill="#fff" stroke="#999"/>
  <text x="406" y="382" text-anchor="middle" font-size="13" fill="#333">♥ J'aime 2</text>
  <text x="472" y="382" font-size="13" fill="#333">2 commentaires</text>
  <rect x="356" y="404" width="568" height="38" fill="#f4f4f4"/>
  <text x="368" y="428" font-size="13" fill="#222"><tspan font-weight="bold">sicilia</tspan> Merci Bob !</text>

  <rect x="340" y="470" width="600" height="130" fill="#fff" stroke="#ccc"/>
  <text x="356" y="498" font-size="15" font-weight="bold" fill="#225" text-decoration="underline">sicilia</text>
  <text x="924" y="498" text-anchor="end" font-size="12" fill="#999">16/11/2026 13:10</text>
  <text x="356" y="528" font-size="15" fill="#222">Ma première publication, modifiée !</text>
  <rect x="356" y="548" width="100" height="30" fill="#fff" stroke="#999"/>
  <text x="406" y="568" text-anchor="middle" font-size="13" fill="#333">♡ J'aime 0</text>
  <text x="472" y="568" font-size="13" fill="#333">0 commentaire</text>
  <text x="850" y="568" text-anchor="end" font-size="13" fill="#225" text-decoration="underline">Modifier</text>
  <text x="924" y="568" text-anchor="end" font-size="13" fill="#a33" text-decoration="underline">Supprimer</text>

  <!-- Panneau de droite : seulement sur grand écran -->
  <rect x="970" y="88" width="270" height="200" fill="#fff" stroke="#ccc"/>
  <circle cx="1105" cy="140" r="32" fill="#ddd" stroke="#999"/>
  <text x="1105" y="150" text-anchor="middle" font-size="26" fill="#666">S</text>
  <text x="1105" y="200" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">sicilia</text>
  <text x="1105" y="226" text-anchor="middle" font-size="13" fill="#444">suit 1 membre</text>
  <text x="1105" y="262" text-anchor="middle" font-size="13" fill="#225" text-decoration="underline">Voir mon profil</text>

  <text x="640" y="660" text-anchor="middle" font-size="13" fill="#888">Sur ordinateur : même contenu que sur mobile, centré sur 600 px de large,</text>
  <text x="640" y="680" text-anchor="middle" font-size="13" fill="#888">avec un panneau « mon profil » à droite. Sur mobile, ce panneau disparaît.</text>
</svg>
