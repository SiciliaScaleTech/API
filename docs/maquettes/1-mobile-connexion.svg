<svg xmlns="http://www.w3.org/2000/svg" width="360" height="740" viewBox="0 0 360 740" font-family="Arial, sans-serif">
  <rect width="360" height="740" fill="#ffffff" stroke="#999" stroke-width="2"/>
  <text x="180" y="40" text-anchor="middle" font-size="12" fill="#999">Maquette mobile : connexion et inscription</text>

  <text x="180" y="100" text-anchor="middle" font-size="30" font-weight="bold" fill="#222">Réseau</text>
  <text x="180" y="128" text-anchor="middle" font-size="14" fill="#666">Partagez avec vos amis</text>

  <!-- Onglets -->
  <rect x="24" y="160" width="156" height="44" fill="#333"/>
  <text x="102" y="188" text-anchor="middle" font-size="15" fill="#fff">Connexion</text>
  <rect x="180" y="160" width="156" height="44" fill="#eee" stroke="#ccc"/>
  <text x="258" y="188" text-anchor="middle" font-size="15" fill="#333">Inscription</text>

  <!-- Formulaire -->
  <text x="24" y="245" font-size="14" fill="#333">Email</text>
  <rect x="24" y="255" width="312" height="44" fill="#fff" stroke="#999"/>
  <text x="36" y="282" font-size="13" fill="#aaa">nom@exemple.fr</text>

  <text x="24" y="330" font-size="14" fill="#333">Mot de passe</text>
  <rect x="24" y="340" width="312" height="44" fill="#fff" stroke="#999"/>
  <text x="36" y="367" font-size="13" fill="#aaa">••••••••</text>

  <!-- Zone d'erreur -->
  <rect x="24" y="404" width="312" height="40" fill="#fde8e8" stroke="#e0a0a0"/>
  <text x="180" y="429" text-anchor="middle" font-size="13" fill="#a33">Zone de message : « Email ou mot de passe incorrect »</text>

  <!-- Bouton -->
  <rect x="24" y="464" width="312" height="48" fill="#333"/>
  <text x="180" y="494" text-anchor="middle" font-size="16" fill="#fff">Se connecter</text>

  <!-- Notes -->
  <text x="24" y="580" font-size="12" fill="#888">Onglet « Inscription » : champs Pseudo, Email,</text>
  <text x="24" y="598" font-size="12" fill="#888">Mot de passe (8 caractères minimum), bouton « Créer mon compte ».</text>
  <text x="24" y="626" font-size="12" fill="#888">Après connexion : redirection vers le fil d'actualité.</text>
</svg>
