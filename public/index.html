<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- Indispensable sur mobile : la page prend la largeur réelle de l'écran -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Réseau - Connexion</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="page-connexion">
  <main class="boite-connexion">
    <h1 class="logo-grand">Réseau</h1>
    <p class="sous-titre">Partagez avec vos amis</p>

    <!-- Onglets : un seul formulaire visible à la fois -->
    <div class="onglets" role="tablist">
      <button type="button" class="onglet actif" id="onglet-connexion" role="tab" aria-selected="true">Connexion</button>
      <button type="button" class="onglet" id="onglet-inscription" role="tab" aria-selected="false">Inscription</button>
    </div>

    <!-- Zone de message : aria-live fait lire le message par les lecteurs d'écran -->
    <p class="message" id="message" aria-live="polite" hidden></p>

    <!-- Formulaire de connexion -->
    <form id="form-connexion" class="formulaire">
      <label for="connexion-email">Email</label>
      <input type="email" id="connexion-email" name="email" required autocomplete="email" placeholder="nom@exemple.fr">

      <label for="connexion-mdp">Mot de passe</label>
      <input type="password" id="connexion-mdp" name="motDePasse" required autocomplete="current-password">

      <button type="submit" class="bouton">Se connecter</button>
    </form>

    <!-- Formulaire d'inscription, caché au départ -->
    <form id="form-inscription" class="formulaire" hidden>
      <label for="inscription-pseudo">Pseudo</label>
      <input type="text" id="inscription-pseudo" name="pseudo" required minlength="3" maxlength="30" autocomplete="username">

      <label for="inscription-email">Email</label>
      <input type="email" id="inscription-email" name="email" required autocomplete="email" placeholder="nom@exemple.fr">

      <label for="inscription-mdp">Mot de passe (8 caractères minimum)</label>
      <input type="password" id="inscription-mdp" name="motDePasse" required minlength="8" maxlength="72" autocomplete="new-password">

      <button type="submit" class="bouton">Créer mon compte</button>
    </form>
  </main>
</body>
</html>
