<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Réseau - Profil</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/api.js" defer></script>
  <script src="/js/cartes.js" defer></script>
  <script src="/js/profil.js" defer></script>
</head>
<body>
  <header class="entete">
    <a href="/fil.html" class="logo">Réseau</a>
    <nav class="entete-droite">
      <button type="button" class="bouton-contour" id="deconnexion">Déconnexion</button>
    </nav>
  </header>

  <main class="colonne">
    <a href="/fil.html" class="retour">← Retour au fil</a>

    <!-- Identité du membre, remplie par profil.js -->
    <section class="profil">
      <div class="avatar grand" id="profil-avatar" aria-hidden="true"></div>
      <h1 class="profil-pseudo" id="profil-pseudo"></h1>
      <p class="profil-bio" id="profil-bio"></p>
      <p id="profil-compteurs"></p>
      <!-- Caché sur mon propre profil -->
      <button type="button" class="bouton" id="bouton-suivre" hidden>Suivre</button>
    </section>

    <p class="message" id="message" aria-live="polite" hidden></p>

    <h2>Publications</h2>
    <section id="publications" aria-label="Publications du membre"></section>
  </main>
</body>
</html>
