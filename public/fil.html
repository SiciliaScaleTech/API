<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Réseau - Fil d'actualité</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/api.js" defer></script>
  <script src="/js/fil.js" defer></script>
</head>
<body>
  <header class="entete">
    <a href="/fil.html" class="logo">Réseau</a>
    <nav class="entete-droite">
      <a href="/profil.html" class="lien-profil" id="mon-pseudo"></a>
      <button type="button" class="bouton-contour" id="deconnexion">Déconnexion</button>
    </nav>
  </header>

  <div class="mise-en-page">
    <main class="colonne">
      <!-- Onglets du fil -->
      <div class="onglets" role="tablist">
        <button type="button" class="onglet actif" id="onglet-fil" role="tab" aria-selected="true">Mon fil</button>
        <button type="button" class="onglet" id="onglet-decouvrir" role="tab" aria-selected="false">Découvrir</button>
      </div>

      <!-- Zone de publication -->
      <form class="carte publier" id="form-publier">
        <label for="contenu" class="visuellement-cache">Votre publication</label>
        <textarea id="contenu" name="contenu" rows="3" maxlength="500" required placeholder="Quoi de neuf ?"></textarea>
        <div class="publier-bas">
          <span class="compteur" id="compteur">0 / 500</span>
          <button type="submit" class="bouton petit">Publier</button>
        </div>
      </form>

      <p class="message" id="message" aria-live="polite" hidden></p>

      <!-- Liste des publications, remplie par fil.js -->
      <section id="publications" aria-label="Publications"></section>
    </main>

    <!-- Panneau de droite : visible seulement sur grand écran (voir le CSS) -->
    <aside class="carte panneau">
      <div class="avatar" id="panneau-avatar" aria-hidden="true"></div>
      <p class="panneau-pseudo" id="panneau-pseudo"></p>
      <p id="panneau-abonnements"></p>
      <a href="/profil.html">Voir mon profil</a>
    </aside>
  </div>
</body>
</html>
